<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GANA-GOL | Quiniela Digital</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f5; margin: 0; padding: 15px; color: #222; }
    .contenedor { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    
    /* Encabezado Llamativo GANA-GOL */
    .header-banner {
      background: linear-gradient(135deg, #0f2e22 0%, #1b4332 60%, #2d6a4f 100%);
      border-radius: 14px;
      padding: 14px 12px;
      margin-bottom: 10px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(27, 67, 50, 0.25);
      border: 2px solid #d4af37;
    }
    .logo-svg { max-width: 300px; width: 100%; height: auto; display: block; margin: auto; }

    /* Bolsa Total Acumulada */
    .bolsa-box {
      background: linear-gradient(90deg, #fff8d6 0%, #ffea85 50%, #fff8d6 100%);
      border: 2px solid #d4af37;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(212, 175, 55, 0.2);
    }
    .bolsa-titulo { font-size: 11px; font-weight: 800; color: #5c4300; text-transform: uppercase; letter-spacing: 1px; display: block; }
    .bolsa-monto { font-size: 22px; font-weight: 900; color: #1b4332; }

    /* Tabla de Premios 1ro, 2do y 3er Lugar */
    .premios-grid {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .premio-card {
      flex: 1;
      background: #f4f9f6;
      border: 1.5px solid #2d6a4f;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }
    .premio-card.oro { background: #fffdf0; border-color: #d4af37; }
    .premio-lugar { font-size: 11px; font-weight: 800; color: #1b4332; display: block; margin-bottom: 3px; }
    .premio-valor { font-size: 14px; font-weight: 900; color: #081c15; }

    /* Espacio de Teléfono para Informes */
    .informes-box {
      background: #e8f3ee;
      border: 1.5px dashed #2d6a4f;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      margin-bottom: 12px;
      font-size: 13px;
      color: #1b4332;
      font-weight: 700;
    }
    .informes-link {
      color: #081c15;
      text-decoration: none;
      background: #ffffff;
      padding: 3px 10px;
      border-radius: 15px;
      border: 1px solid #2d6a4f;
      display: inline-block;
      margin-left: 4px;
      font-weight: 800;
    }
    
    .info-bar { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #444; margin-bottom: 16px; font-weight: 600; }
    .badge-wa { background: #25D366; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; box-shadow: 0 2px 5px rgba(37, 211, 102, 0.3); }
    
    input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #d8e2dc; border-radius: 10px; box-sizing: border-box; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #2d6a4f; }
    
    .partido { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .equipos { font-weight: 600; font-size: 14px; width: 58%; }
    .opciones { display: flex; gap: 6px; }
    .btn-op { width: 38px; height: 38px; border: 2px solid #2d6a4f; background: #fff; color: #2d6a4f; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.15s; }
    .btn-op.activo { background: #1b4332; border-color: #1b4332; color: #fff; }
    
    .acciones { display: flex; gap: 8px; margin-top: 16px; }
    .btn-accion { flex: 1; padding: 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-azar { background: #e9ecef; color: #333; }
    .btn-limpiar { background: #ffe3e3; color: #c92a2a; }
    
    .resumen-actual { margin-top: 14px; text-align: center; font-size: 15px; font-weight: bold; color: #1b4332; background: #f4f9f6; padding: 10px; border-radius: 8px; }
    .btn-agregar { width: 100%; padding: 13px; margin-top: 12px; background: #1b4332; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    
    .carrito { margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 15px; }
    .carrito h3 { margin: 0 0 10px 0; font-size: 16px; color: #1b4332; }
    .item-quiniela { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
    .item-info strong { color: #1b4332; display: block; margin-bottom: 3px; }
    .btn-eliminar { background: #ff6b6b; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: bold; }
    
    .total-final { text-align: center; font-size: 18px; font-weight: 800; color: #1b4332; margin: 15px 0 10px 0; }
    .btn-whatsapp { width: 100%; padding: 15px; background: #25D366; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
    .btn-whatsapp:disabled { background: #95d5b2; cursor: not-allowed; }
  </style>
</head>
