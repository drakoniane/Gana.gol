<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gana.Gol - Quiniela $10</title>
<style>
  *{box-sizing:border-box;font-family:Arial, sans-serif}
  body{margin:0;background:#0f172a;color:#fff;padding:16px}
  .header{text-align:center;margin-bottom:16px}
  .header h1{margin:0;font-size:32px;color:#22c55e}
  .header p{margin:4px 0;color:#cbd5e1}
  .bote{background:#22c55e;color:#000;font-weight:bold;text-align:center;padding:10px;border-radius:10px;margin:12px 0}
  input[type=text]{width:100%;padding:12px;border-radius:10px;border:none;font-size:16px;margin-bottom:12px}
  .partido{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:12px}
  .partido-top{display:flex;justify-content:space-between;align-items:center}
  .partido-top b{font-size:15px}
  .partido-top span{font-size:12px;background:#334155;padding:4px 8px;border-radius:20px}
  .equipos{font-size:18px;font-weight:bold;margin:10px 0;text-align:center}
  .opciones{display:flex;gap:8px}
  .opciones label{flex:1;text-align:center;background:#0f172a;border:2px solid #334155;border-radius:10px;padding:12px 0;cursor:pointer;font-weight:bold}
  .opciones input{display:none}
  .opciones input:checked + span{color:#22c55e}
  .opciones label:has(input:checked){border-color:#22c55e;background:#14532d}
  .btn{width:100%;background:#22c55e;color:#000;border:none;padding:15px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
  .btn2{background:#fff;margin-top:8px}
  .lista{background:#1e293b;border-radius:14px;padding:14px;margin-top:16px}
  .fila{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155;font-size:14px}
  .small{font-size:12px;color:#94a3b8;text-align:center}
</style>
</head>
<body>

<div class="header">
  <h1>Gana.Gol ⚽</h1>
  <p>Quiniela Media Semana - $10 por renglón</p>
  <p>9 partidos | Gana el que tenga más aciertos</p>
</div>

<div class="bote" id="bote">Bote acumulado: $0 | Jugadores: 0</div>

<input type="text" id="nombre" placeholder="Escribe tu nombre o apodo... Ej: MONTERREY">

<div id="partidos"></div>

<button class="btn" onclick="guardar()">✅ GUARDAR MI QUINIELA</button>
<button class="btn btn2" onclick="copiar()">📋 COPIAR Y MANDAR POR WHATSAPP</button>
<p class="small">Tus picks se guardan en tu celular. Para la hoja general, mándame tu captura o tu texto por WhatsApp.</p>

<div class="lista">
  <b>📋 Mis picks guardados:</b>
  <div id="misPicks">Aún no has guardado nada</div>
</div>

<script>
const partidos = [
  {local:"Turquía", visita:"Bélgica", dia:"Jueves 1:45 p.m."},
  {local:"Italia", visita:"Francia", dia:"Jueves 1:45 p.m."},
  {local:"Chequia", visita:"España", dia:"Jueves 1:45 p.m."},
  {local:"Inglaterra", visita:"Croacia", dia:"Jueves 1:45 p.m."},
  {local:"Países Bajos", visita:"Grecia", dia:"Viernes 1:45 p.m."},
  {local:"Serbia", visita:"Alemania", dia:"Viernes 1:45 p.m."},
  {local:"Argentina", visita:"Uruguay", dia:"Viernes 5:00 p.m."},
  {local:"Colombia", visita:"Chile", dia:"Viernes 6:00 p.m."},
  {local:"Ecuador", visita:"Costa Rica", dia:"Viernes 6:00 p.m."},
];

const cont = document.getElementById('partidos');
partidos.forEach((p,i)=>{
  cont.innerHTML += `
  <div class="partido">
    <div class="partido-top"><b>PARTIDO ${i+1}</b><span>${p.dia}</span></div>
    <div class="equipos">${p.local} vs ${p.visita}</div>
    <div class="opciones">
      <label><input type="radio" name="p${i}" value="L"><span>L<br>Local</span></label>
      <label><input type="radio" name="p${i}" value="E"><span>E<br>Empate</span></label>
      <label><input type="radio" name="p${i}" value="V"><span>V<br>Visita</span></label>
    </div>
  </div>`;
});

function getPicks(){
  let picks=[];
  for(let i=0;i<9;i++){
    let sel=document.querySelector(`input[name="p${i}"]:checked`);
    picks.push(sel?sel.value:"-");
  }
  return picks;
}

function guardar(){
  const nombre=document.getElementById('nombre').value.trim();
  if(!nombre){alert('Pon tu nombre primero');return;}
  const picks=getPicks();
  if(picks.includes('-')){alert('Te faltan partidos por marcar');return;}
  localStorage.setItem('ganagol_'+nombre, JSON.stringify(picks));
  document.getElementById('misPicks').innerHTML = `<div class="fila"><b>${nombre}</b><span>${picks.join(' - ')}</span></div>`;
  document.getElementById('bote').innerText = `¡Listo ${nombre}! Tu quiniela quedó guardada ✅`;
  alert('Guardado: '+nombre+' - '+picks.join(' '));
}

function copiar(){
  const nombre=document.getElementById('nombre').value.trim()||'SIN NOMBRE';
  const picks=getPicks();
  const texto=`Gana.Gol - ${nombre}\n`+partidos.map((p,i)=>`${i+1}. ${p.local} vs ${p.visita}: ${picks[i]}`).join('\n');
  navigator.clipboard.writeText(texto);
  alert('Copiado! Ahora pégalo en WhatsApp');
}
</script>
</body>
</html>
