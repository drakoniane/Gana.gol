<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gana.Gol</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');
  *{box-sizing:border-box;font-family:'Montserrat',Arial,sans-serif}
  body{margin:0;background:radial-gradient(1000px 500px at 50% -10%, #22c55e 0%, #0f172a 50%, #020617 100%);color:#fff;padding:14px;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto}
  .top{text-align:center}
  .top h1{font-size:38px;margin:10px 0 0;font-weight:900}.top h1 span{color:#22c55e}
  .sub{font-size:14px;font-weight:800;color:#facc15}
  .bote{margin:14px 0;background:linear-gradient(90deg,#22c55e,#facc15);color:#000;font-weight:900;text-align:center;padding:14px;border-radius:14px;font-size:16px}
  .nombre-box{background:#fff;color:#000;border-radius:18px;padding:14px;margin:12px 0;border:3px solid #facc15}
  .nombre-box label{display:block;font-size:14px;font-weight:900;margin-bottom:8px}
  .nombre-box input{width:100%;padding:14px;border-radius:12px;border:2px solid #000;font-size:18px;font-weight:900;outline:none;text-transform:uppercase}
  .card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px;margin-bottom:12px}
  .head{display:flex;justify-content:space-between;font-size:12px;color:#22c55e;font-weight:800}
  .vs{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-weight:900;font-size:14px;text-align:center}
  .vs div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .vs i{width:38px;height:38px;background:#ffffff12;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
  .escudo{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
  .opts{display:flex;gap:8px}.opts label{flex:1;background:#0b1220;border:2px solid #1e293b;border-radius:12px;padding:10px 0;text-align:center;cursor:pointer}
  .opts input{display:none}.opts label:has(input:checked){background:#22c55e;color:#000}
  .btn{width:100%;border:none;padding:15px;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;margin-top:8px}
  .btn-add{background:#fff;color:#000}.btn-clear{background:#ef4444;color:#fff}.btn-wsp{background:#25D366;color:#000;font-size:18px}
  .lista-q{background:#0f172a;border:1px dashed #22c55e;border-radius:14px;padding:12px;margin-top:12px;font-size:13px;line-height:1.6}
  .total-box{text-align:center;font-size:20px;font-weight:900;margin-top:10px;color:#facc15}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Gana.<span>Gol</span> ⚽</h1><div class="sub">🔥 6 PARTIDOS • $10 POR QUINIELA 🔥</div></div>
  <div class="bote">💰 BOTE ACUMULADO: $1,000 MXN 💰</div>
  <div class="nombre-box"><label>👤 ¿CUÁL ES TU NOMBRE?</label><input id="nombre" placeholder="ESCRIBE TU NOMBRE AQUÍ..."></div>
  <div id="lista"></div>
  <button class="btn btn-add" onclick="agregarQuiniela()">➕ AGREGAR ESTA QUINIELA ($10)</button>
  <button class="btn btn-clear" onclick="limpiarTodo()">🧹 LIMPIAR TODO</button>
  <div class="lista-q" id="misQuinielas">Aún no has agregado ninguna quiniela.</div>
  <div class="total-box" id="total">Total a pagar: $0</div>
  <button class="btn btn-wsp" onclick="enviarTodo()">📲 ENVIAR TODO POR WHATSAPP</button>
</div>
<script>
const partidos=[
  {l:"España", v:"Inglaterra", imgL:"https://upload.wikimedia.org/wikipedia/en/1/13/Spain_national_football_team_crest.svg", imgV:"https://upload.wikimedia.org/wikipedia/en/5/52/England_national_football_team_crest.svg"},
  {l:"Bélgica", v:"Italia", imgL:"https://upload.wikimedia.org/wikipedia/commons/8/8e/Belgium_national_football_team_logo.svg", imgV:"https://upload.wikimedia.org/wikipedia/commons/8/83/Italy_national_football_team_logo.svg"},
  {l:"Francia", v:"Turquía", imgL:"https://upload.wikimedia.org/wikipedia/en/8/8f/France_national_football_team_crest.svg", imgV:"https://upload.wikimedia.org/wikipedia/en/0/0f/Turkey_national_football_team_logo.svg"},
  {l:"Croacia", v:"Rep. Checa", imgL:"https://upload.wikimedia.org/wikipedia/en/5/5d/Croatia_national_football_team_crest.svg", imgV:"https://upload.wikimedia.org/wikipedia/en/9/9e/Czech_Republic_national_football_team_logo.svg"},
  {l:"Guadalajara", v:"Cruz Azul", imgL:"https://upload.wikimedia.org/wikipedia/commons/5/5d/C.D._Guadalajara_logo.svg", imgV:"https://upload.wikimedia.org/wikipedia/commons/4/48/Cruz_Azul_logo.svg"},
  {l:"Querétaro", v:"Necaxa", imgL:"https://upload.wikimedia.org/wikipedia/en/6/6e/Queretaro_FC_logo.svg", imgV:"https://upload.wikimedia.org/wikipedia/commons/7/7b/Club_Necaxa_logo.svg"},
];
let misQuinielas=[];
const cont=document.getElementById('lista');
partidos.forEach((p,i)=>{
  cont.innerHTML+=`<div class="card"><div class="head"><b>PARTIDO ${i+1}</b><span>$10</span></div><div class="vs"><div><img class="escudo" src="${p.imgL}"><span>${p.l}</span></div><i>VS</i><div><img class="escudo" src="${p.imgV}"><span>${p.v}</span></div></div><div class="opts"><label><input type="radio" name="p${i}" value="L"><b>L</b><br><small>Local</small></label><label><input type="radio" name="p${i}" value="E"><b>E</b><br><small>Empate</small></label><label><input type="radio" name="p${i}" value="V"><b>V</b><br><small>Visita</small></label></div></div>`;
});
function leer(){let s=[];for(let i=0;i<6;i++){let x=document.querySelector(`input[name="p${i}"]:checked`);if(!x)return null;s.push(x.value);}return s;}
function limpiarSel(){document.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=false);}
function vista(){const d=document.getElementById('misQuinielas');const n=document.getElementById('nombre').value.trim()||"SIN NOMBRE";if(misQuinielas.length===0){d.innerHTML="Aún no has agregado ninguna quiniela.";}else{d.innerHTML=`<b>👤 JUGADOR: ${n.toUpperCase()}</b><br>`+misQuinielas.map((q,i)=>`Quiniela ${i+1}: ${q.join(' - ')}`).join('<br>');}document.getElementById('total').innerText=`Total a pagar: $${misQuinielas.length*10}`;}
document.getElementById('nombre').addEventListener('input',vista);
function agregarQuiniela(){const n=document.getElementById('nombre').value.trim();if(!n){alert('¡Primero pon tu NOMBRE!');return;}const s=leer();if(!s){alert('¡Te falta marcar un partido!');return;}misQuinielas.push(s);limpiarSel();vista();}
function limpiarTodo(){if(!confirm('¿Borrar todas?'))return;misQuinielas=[];limpiarSel();vista();}
function enviarTodo(){const n=document.getElementById('nombre').value.trim();if(!n){alert('Pon tu nombre');return;}if(misQuinielas.length===0){alert('Agrega al menos 1 quiniela');return;}let t=`*🔥 GANA.GOL 🔥*%0A%0A*Jugador:* ${n}%0A*Quinielas:* ${misQuinielas.length}%0A*Total:* $${misQuinielas.length*10}%0A%0A`;misQuinielas.forEach((q,i)=>{t+=`*Quiniela ${i+1}:* ${q.join(' | ')}%0A`;});window.open(`https://wa.me/524421189693?text=${t}`,'_blank');}
</script>
</body>
</html>
